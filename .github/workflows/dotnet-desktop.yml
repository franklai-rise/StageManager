name: Desktop build and attested draft release
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  APP_PROJECT: StageManager.Card3DPrototype/StageManager.Card3DPrototype.csproj
  TEST_PROJECT: StageManager.Tests/StageManager.Tests.csproj
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Build production entry and run regression suite
        shell: pwsh
        run: |
          dotnet build $env:APP_PROJECT -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project $env:TEST_PROJECT -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate website scripts
        run: |
          node --check site/app.js
          python -m py_compile site/build_release.py
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Verify tag belongs to main and matches project version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Only vX.Y.Z release tags are supported" }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release commit must belong to main" }
          [xml]$project = Get-Content $env:APP_PROJECT
          if ($project.Project.PropertyGroup.Version -ne $tag.Substring(1)) { throw "Tag/project version mismatch" }
      - name: Build final single-file EXE and provenance manifest
        shell: pwsh
        run: |
          dotnet publish $env:APP_PROJECT -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=false -p:ContinuousIntegrationBuild=true -p:SourceRevisionId=$env:GITHUB_SHA -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
          $name = "Stage_Manager_Lai_$env:GITHUB_REF_NAME.exe"
          Copy-Item -LiteralPath "artifacts/publish/$name" -Destination "artifacts/release/$name"
          $hash = (Get-FileHash -Algorithm SHA256 "artifacts/release/$name").Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "artifacts/release/SHA256SUMS.txt" -Encoding utf8NoBOM
          @{tag=$env:GITHUB_REF_NAME; commit=(git rev-parse HEAD); file=$name; sha256=$hash; run="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"; sdk=(dotnet --version); builtAtUtc=[DateTimeOffset]::UtcNow.ToString("O")} | ConvertTo-Json | Set-Content artifacts/release/build-info.json -Encoding utf8NoBOM
      - name: Attest final executable bytes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/release/*.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: artifacts/release/*
          retention-days: 30
      - name: Create draft only; never overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release already exists; refusing to replace tested assets" }
          gh release create $env:GITHUB_REF_NAME artifacts/release/* --repo $env:GITHUB_REPOSITORY --verify-tag --target $env:GITHUB_SHA --draft --title "Stage_Manager_Lai $env:GITHUB_REF_NAME" --notes-file "docs/releases/$env:GITHUB_REF_NAME.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
