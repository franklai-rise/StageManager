name: Stage_Manager_Lai CI and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "Stage_Manager_Lai_v*"
  pull_request:

permissions:
  contents: read

env:
  SOLUTION_PATH: StageManager.sln
  APP_PROJECT: StageManager.App/StageManager.App.csproj
  TEST_PROJECT: StageManager.Tests/StageManager.Tests.csproj
  PUBLISH_DIR: artifacts/publish

jobs:
  build-test:
    name: Restore, build, and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore "$env:SOLUTION_PATH"

      - name: Build
        shell: pwsh
        run: dotnet build "$env:SOLUTION_PATH" --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: >-
          dotnet test "$env:TEST_PROJECT"
          --configuration Release
          --no-build
          --no-restore

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/Stage_Manager_Lai_v')
    needs: build-test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore formal application
        shell: pwsh
        run: dotnet restore "$env:APP_PROJECT" --runtime win-x64

      - name: Publish formal application
        shell: pwsh
        run: >-
          dotnet publish "$env:APP_PROJECT"
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output "$env:PUBLISH_DIR"
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=false
          -p:PublishReadyToRun=false
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Name release asset and generate SHA256
        shell: pwsh
        run: |
          $assemblyName = (& dotnet msbuild "$env:APP_PROJECT" --nologo -getProperty:AssemblyName).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($assemblyName)) {
            throw "Could not resolve the formal application's AssemblyName."
          }

          $publishedPath = Join-Path $env:PUBLISH_DIR "$assemblyName.exe"
          $assetName = "$env:RELEASE_NAME.exe"
          $assetPath = Join-Path $env:PUBLISH_DIR $assetName
          $checksumPath = "$assetPath.sha256"

          if (-not (Test-Path -LiteralPath $publishedPath -PathType Leaf)) {
            throw "Published executable was not found: $publishedPath"
          }

          Move-Item -LiteralPath $publishedPath -Destination $assetPath -Force
          $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -LiteralPath $checksumPath -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-win-x64
          path: |
            ${{ env.PUBLISH_DIR }}/${{ github.ref_name }}.exe
            ${{ env.PUBLISH_DIR }}/${{ github.ref_name }}.exe.sha256
          if-no-files-found: error

      - name: Create GitHub Release and upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetPath = Join-Path $env:PUBLISH_DIR "$env:RELEASE_NAME.exe"
          $checksumPath = "$assetPath.sha256"

          gh release create "$env:RELEASE_NAME" `
            "$assetPath" `
            "$checksumPath" `
            --repo "${{ github.repository }}" `
            --verify-tag `
            --title "$env:RELEASE_NAME" `
            --generate-notes
