name: Stage Manager Lai website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site-pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stage-manager-lai-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the website from main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read latest release and assemble website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python site/build_release.py --output artifacts/website
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
